services:
  nextup:
    image: ghcr.io/${GITHUB_REPOSITORY:-janlunge/nextup}:latest
    container_name: nextup
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./data:/data
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_PATH=/data/queue.db
      - UPLOAD_PATH=/data/uploads
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    labels:
      - "traefik.http.routers.nextup.rule=Host(`nextup.wsto.re`)"
      - traefik.http.routers.nextup.tls=true
      - traefik.http.routers.nextup.tls.certresolver=myresolver
    networks:
      - web
networks:
  web:
    external:
      name: web